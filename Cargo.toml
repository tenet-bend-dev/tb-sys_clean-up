[package]
name = "tb-clean_up"
version = "2.0.0"
edition = "2021"
rust-version = "1.74"
description = "Windows system maintenance and clean-up utility"
build = "build.rs"

[dependencies]
winreg = "0.52"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true